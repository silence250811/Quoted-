<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quoted?</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #050505;
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 25px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            min-height: 600px;
            padding: 60px 70px;
            background: #0d0d0d;
            border: 1px solid #333;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.08);
            text-align: center;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .corner {
            position: absolute;
            width: 25px;
            height: 25px;
            border-color: cyan;
            border-style: solid;
        }

        .top-left {
            top: -1px;
            left: -1px;
            border-width: 3px 0 0 1px;
        }

        .top-right {
            top: -1px;
            right: -1px;
            border-width: 3px 3px 0 0;
        }

        .bottom-left {
            bottom: -1px;
            left: -1px;
            border-width: 0 0 3px 3px;
        }

        .bottom-right {
            bottom: -1px;
            right: -1px;
            border-width: 0 3px 3px 0;
        }

        .label {
            color: rgb(102, 118, 241);
            font-size: 13.5px;
            letter-spacing: 1px;
            margin-bottom: 20px;
            opacity: 0.8;
        }

        h1 {
            margin: 0;
            color: cyan;
            font-size: 5px;
            letter-spacing: 0.5px;
            text-shadow: 0 0 12px rgba(87, 89, 89, 0.4);
        }

        .subtitle {
            margin-top: 35px;
            margin-bottom: 65px;
            font-family: "Segoe Print", cursive;
            color: #00ffe5;
            font-size: 30px;
            letter-spacing: 1px;
        }

        .quote-area {
            min-height: 190px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        #quote {
            max-width: 900px;
            margin: 0;
            color: #eeeeee;
            font-size: 25px;
            line-height: 1.6;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        #author {
            margin-top: 20px;
            color: cyan;
            font-size: 13.5px;
            letter-spacing: 1px;
            transition: opacity 0.3s ease;
        }

        #newQuoteButton {
            margin: 50px auto 0;
            padding: 15px 35px;
            background: transparent;
            border: 3px round cyan;
            border-radius: 5px;
            color: cyan;
            cursor: pointer;
            font-size: 20px;
            letter-spacing: 1.5px;
            transition: all 0.25s ease;
        }

        #newQuoteButton:hover {
            background: cyan;
            color: black;
            box-shadow: 0 0 20px cyan;
            transform: translateY(-2px);
        }

        #newQuoteButton:active {
            transform: translateY(0);
        }

        .divider {
            width: 100%;
            height: 1px;
            background: #222;
            margin: 50px 0 25px;
        }

        footer {
            color: #3f4142;
            font-size: 15px;
            letter-spacing: 2.5px;
        }

        @media (max-width: 600px) {
            .container {
                padding: 40px 25px;
                min-height: 550px;
            }

            h1 {
                font-size: 25px;
            }

            #quote {
                font-size: 20px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>

        <div class="label">
            Web
        </div>

        <h1>
            .
        </h1>

        <p class="subtitle">
            Quoted?
        </p>

        <div class="quote-area">

            <p id="quote"></p>

            <p id="author"></p>

        </div>

        <button id="newQuoteButton">
            Quote?
        </button>

        <div class="divider"></div>

        <footer>
            • Made by Silence •
        </footer>

    </div>

    <script>

        const quotes = [
            {
                text: "At the end of the day, all that matters is the Truth behind all.",
                author: "— Silence"
            },
            {
                text: "Your work is going to fill a large part of your life, and the only way to be truly satisfied is to do what you believe is great work.",
                author: "— Steve Jobs"
            },
            {
                text: "Life is a journey, not a destination.",
                author: "— Ralph Waldo Emerson"
            },
            {
                text: "Do not desire unless you deserve it.",
                author: "— Silence"
            },
            {
                text: "Do every act of your life as though it were your last.",
                author: "— Marcus Aurelius"
            },
            {
                text: "Waste no more time arguing about what a good person should be. Be one.",
                author: "— Marcus Aurelius"
            },
            {
                text: "Life's a Game",
                author: "— Silence"
            },
            {
                text: "Sometimes the Hardest thing to do is keep going.",
                author: "— ?"
            },
            {
                text: "Time changes things that nothing else can.",
                author: "— ?"
            },
            {
                text: "This world is too cruel.",
                author: "— Silence"
            },
            {
                text: "The hardest thing to do is accepting the truth and following it.",
                author: "— Silence"
            },
            {
                text: "You can't win without losing something",
                author: "— ?"
            }
        ];

        let currentQuote = -1;

        const quote = document.getElementById("quote");
        const author = document.getElementById("author");
        const button = document.getElementById("newQuoteButton");

        function newQuote() {

            let randomIndex;

            do {
                randomIndex = Math.floor(Math.random() * quotes.length);
            } while (randomIndex === currentQuote && quotes.length > 1);

            currentQuote = randomIndex;

            quote.style.opacity = "0";
            quote.style.transform = "translateY(8px)";
            author.style.opacity = "0";

            setTimeout(function () {

                quote.textContent = '"' + quotes[randomIndex].text + '"';
                author.textContent = quotes[randomIndex].author;

                quote.style.opacity = "1";
                quote.style.transform = "translateY(0)";
                author.style.opacity = "1";

            }, 300);
        }

        button.addEventListener("click", newQuote);

        newQuote();

    </script>

</body>

</html>

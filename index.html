<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Life // Archive</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            background: #050505;
            color: white;

            font-family: Arial, sans-serif;

            display: flex;
            justify-content: center;
            align-items: center;

            overflow: hidden;
        }


        /* MAIN CONTAINER */

        .container {
            width: 90%;
            max-width: 750px;

            padding: 50px;

            border: 1px solid #333;

            background: #0d0d0d;

            box-shadow:
                0 0 30px rgba(0, 255, 255, 0.08);

            text-align: center;

            position: relative;
        }


        /* TOP LABEL */

        .label {
            color: cyan;

            font-size: 13px;

            letter-spacing: 4px;

            margin-bottom: 35px;

            opacity: 0.8;
        }


        /* TITLE */

        h1 {
            color: cyan;

            letter-spacing: 5px;

            font-size: 32px;

            margin: 0 0 10px 0;

            text-shadow:
                0 0 10px rgba(0, 255, 255, 0.4);
        }


        .subtitle {
            color: #666;

            font-size: 14px;

            margin-bottom: 50px;
        }


        /* QUOTE */

        #quote {
            font-size: 24px;

            line-height: 1.6;

            color: #eee;

            margin: 0 auto 20px auto;

            max-width: 600px;

            min-height: 80px;

            transition: opacity 0.4s;
        }


        /* AUTHOR */

        #author {
            color: cyan;

            font-size: 14px;

            letter-spacing: 2px;

            margin-bottom: 40px;

            transition: opacity 0.4s;
        }


        /* BUTTON */

        button {
            padding: 13px 28px;

            background: transparent;

            border: 1px solid cyan;

            color: cyan;

            cursor: pointer;

            font-size: 14px;

            letter-spacing: 1px;

            transition: 0.25s;
        }


        button:hover {
            background: cyan;

            color: black;

            box-shadow:
                0 0 20px cyan;

            transform: translateY(-2px);
        }


        button:active {
            transform: translateY(0);
        }


        /* DIVIDER */

        .divider {
            height: 1px;

            width: 100%;

            background: #222;

            margin: 45px 0 25px 0;
        }


        /* FOOTER */

        footer {
            color: #444;

            font-size: 11px;

            letter-spacing: 2px;
        }


        /* SMALL CYAN CORNERS */

        .corner {
            position: absolute;

            width: 15px;
            height: 15px;

            border-color: cyan;
            border-style: solid;
        }

        .top-left {
            top: -1px;
            left: -1px;

            border-width: 1px 0 0 1px;
        }

        .top-right {
            top: -1px;
            right: -1px;

            border-width: 1px 1px 0 0;
        }

        .bottom-left {
            bottom: -1px;
            left: -1px;

            border-width: 0 0 1px 1px;
        }

        .bottom-right {
            bottom: -1px;
            right: -1px;

            border-width: 0 1px 1px 0;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            .container {
                padding: 30px 20px;
            }

            h1 {
                font-size: 24px;
            }

            #quote {
                font-size: 19px;
            }

        }

    </style>

</head>


<body>


    <div class="container">

        <!-- CYAN CORNERS -->

        <div class="corner top-left"></div>
        <div class="corner top-right"></div>
        <div class="corner bottom-left"></div>
        <div class="corner bottom-right"></div>


        <div class="label">
            Life // Archive
        </div>


        <h1>
            Words to live by...
        </h1>


        <p class="subtitle">
            Some thoughts are worth keeping.
        </p>


        <!-- QUOTE -->

        <p id="quote"></p>

        <p id="author"></p>


        <!-- BUTTON -->

        <button onclick="newQuote()">
            Quote?
        </button>


        <div class="divider"></div>


        <footer>
            Thoughts • Life • Time
        </footer>

    </div>


    <script>


        /* =====================================
           YOUR QUOTES GO HERE
           ===================================== */

        const quotes = [

            {
                text: "Your first quote goes here.",
                author: "— Anonymous"
            },

            {
                text: "Your second quote goes here.",
                author: "— Anonymous"
            },

            {
                text: "Your third quote goes here.",
                author: "— Anonymous"
            },

            {
                text: "Your fourth quote goes here.",
                author: "— Anonymous"
            }

        ];


        /* =====================================
           WEBSITE CODE
           DON'T NEED TO TOUCH THIS PART
           ===================================== */


        let currentQuote = -1;


        function newQuote() {

            let randomQuote;


            /* Prevents the same quote appearing twice */

            do {

                randomQuote =
                    Math.floor(Math.random() * quotes.length);

            } while (
                randomQuote === currentQuote &&
                quotes.length > 1
            );


            currentQuote = randomQuote;


            const quoteElement =
                document.getElementById("quote");

            const authorElement =
                document.getElementById("author");


            /* Fade out */

            quoteElement.style.opacity = "0";
            authorElement.style.opacity = "0";


            setTimeout(() => {

                quoteElement.textContent =
                    '"' + quotes[randomQuote].text + '"';

                authorElement.textContent =
                    quotes[randomQuote].author;


                /* Fade in */

                quoteElement.style.opacity = "1";
                authorElement.style.opacity = "1";

            }, 300);

        }


        /* Show a quote when the website opens */

        newQuote();


    </script>


</body>

</html>
